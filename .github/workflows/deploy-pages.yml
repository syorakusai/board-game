name: Deploy public and development Pages

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public source
        uses: actions/checkout@v4
        with:
          ref: main
          path: public

      - name: Check out development source
        uses: actions/checkout@v4
        with:
          ref: develop
          path: development

      - name: Build Pages artifact
        run: node public/scripts/build-pages.mjs --prod public --dev development --output pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
