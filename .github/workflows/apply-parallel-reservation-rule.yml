name: Apply parallel reservation rule

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-parallel-reservation-rule.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Add private card reservation rule through GitHub Contents API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'firebase-rules.json';
          const rules = JSON.parse(fs.readFileSync(path, 'utf8'));
          rules.rules.roomCardReservations = {
            "$roomId": {
              "$cardId": {
                ".read": "auth != null && data.child('uid').val() == auth.uid",
                ".write": "auth != null && !data.exists() && newData.exists() && root.child('rooms').child($roomId).child('status').val() == 'started' && root.child('rooms').child($roomId).child('players').child(auth.uid).exists() && newData.child('uid').val() == auth.uid && newData.child('feastId').val() == root.child('rooms').child($roomId).child('feastId').val()",
                ".validate": "newData.hasChildren(['uid','feastId','cycleNumber','claimedAt']) && newData.child('uid').val() == auth.uid && newData.child('feastId').isString() && newData.child('cycleNumber').isNumber() && newData.child('cycleNumber').val() >= 1 && newData.child('claimedAt').isNumber()"
              }
            }
          };
          const output = JSON.stringify(rules, null, 2) + '\n';
          const [owner, repo] = process.env.GH_REPOSITORY.split('/');
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          const api = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=develop`;
          const currentResponse = await fetch(api, { headers });
          if (!currentResponse.ok) throw new Error(`GET failed: ${currentResponse.status} ${await currentResponse.text()}`);
          const current = await currentResponse.json();
          const putResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
            method: 'PUT',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: 'Firebase Rulesに一斉仕込み用カード予約を追加',
              content: Buffer.from(output, 'utf8').toString('base64'),
              sha: current.sha,
              branch: 'develop'
            })
          });
          if (!putResponse.ok) throw new Error(`PUT failed: ${putResponse.status} ${await putResponse.text()}`);
          console.log('firebase-rules.json updated');
          NODE
