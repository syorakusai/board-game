name: Update asset cache version

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - ".github/workflows/cache-bust.yml"

permissions:
  contents: write

jobs:
  update-cache-version:
    if: github.event.head_commit.message != 'Update asset cache version'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update asset query versions
        id: update
        env:
          VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          version = os.environ["VERSION"][:7]
          updated = re.sub(r"styles\.css\?v=[^\\"']+", f"styles.css?v={version}", text)
          updated = re.sub(r"app\.js\?v=[^\\"']+", f"app.js?v={version}", updated)
          if updated == text:
              raise SystemExit("No cache-busted asset references found")
          path.write_text(updated, encoding="utf-8")
          PY

          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated cache version
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update asset cache version"
          git push
