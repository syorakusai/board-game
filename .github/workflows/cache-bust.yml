name: Update asset cache version

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "cards/**"
      - "assets/**"
      - ".github/workflows/cache-bust.yml"

concurrency:
  group: asset-cache-version
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-cache-version:
    if: github.event.head_commit.message != 'Update asset cache version'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update and commit cache version
        env:
          VERSION: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            python -c 'import os,re; from pathlib import Path; p=Path("index.html"); t=p.read_text(encoding="utf-8"); v=os.environ["VERSION"][:7]; u=re.sub(r"styles\.css\?v=[^"]+", f"styles.css?v={v}", t); u=re.sub(r"app\.js\?v=[^"]+", f"app.js?v={v}", u); p.write_text(u, encoding="utf-8")'

            if git diff --quiet -- index.html; then
              echo "Cache version is already current"
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Update asset cache version"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; retrying (attempt $attempt/5)"
            git fetch origin main
            git reset --hard origin/main
            sleep 2
          done

          echo "Unable to push the cache version update after 5 attempts"
          exit 1
