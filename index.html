<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ワードカードゲーム</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="app-shell">
      <section class="screen" data-screen="player-count">
        <p class="eyebrow">WORD CARD GAME</p>
        <h1>対戦人数を選択</h1>
        <p class="description">一緒に遊ぶ人数を選んでください。</p>
        <div id="player-counts" class="count-grid" aria-label="対戦人数"></div>
      </section>

      <section class="screen is-hidden" data-screen="player-names">
        <p class="eyebrow">STEP 2</p>
        <h1>プレイヤー名を登録</h1>
        <p id="name-description" class="description"></p>
        <form id="player-form" novalidate>
          <div id="name-fields" class="name-fields"></div>
          <p id="form-error" class="form-error" role="alert"></p>
          <div class="button-row">
            <button type="button" id="back-button" class="button button-secondary">戻る</button>
            <button type="submit" class="button button-primary">ゲームを始める</button>
          </div>
        </form>
      </section>

      <section class="screen is-hidden" data-screen="lobby">
        <p class="eyebrow">GAME READY</p>
        <h1>準備完了</h1>
        <p class="description">参加プレイヤーを確認してください。</p>
        <div id="player-list" class="player-list"></div>
        <button type="button" id="restart-button" class="button button-primary">最初に戻る</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
